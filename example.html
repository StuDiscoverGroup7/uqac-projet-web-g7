<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenStreetMap example (Leaflet)</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* full-page map */
        html, body { height: 100%; margin: 0; }
        #map { width: 50%; height: 20%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Quebec City as an example
        const map = L.map('map').setView([46.8139, -71.2080], 13);

        // OpenStreetMap tile layer (with proper attribution)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Example marker with popup
        const marker = L.marker([46.8139, -71.2080]).addTo(map)
            .bindPopup('Example marker: Québec City').openPopup();

        // Add scale control
        L.control.scale().addTo(map);

        // Click on map to show coordinates in a popup
        map.on('click', function(e) {
            L.popup()
             .setLatLng(e.latlng)
             .setContent('Lat: ' + e.latlng.lat.toFixed(5) + '<br>Lng: ' + e.latlng.lng.toFixed(5))
             .openOn(map);
        });
    </script>
</body>
</html>
